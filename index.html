<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PA-Wallet</title>
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icon.png">
    <!-- Noto Sans TC (繁體中文) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">

        <!-- 歡迎畫面 (Landing) -->
        <section id="landing-section" class="section landing-container">
            <div class="landing-card">
                <div class="app-logo">💰</div>
                <h1>PA-Wallet</h1>
                <p class="subtitle">This is Peiya & Alan's spending.<br>Peiya please don't spend too much 🥺</p>
                <button id="go-login-btn" class="btn btn-primary btn-lg">Open Wallet</button>
            </div>
        </section>

        <!-- 登入畫面 -->
        <section id="login-section" class="section hidden">
            <div class="login-card">
                <button id="back-to-landing" class="btn-icon back-btn">←</button>
                <div class="app-logo small">💰</div>
                <h2>Log in</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Who are you?</label>
                        <input type="text" id="username" name="username" required autocomplete="username"
                            placeholder="Name">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password"
                            placeholder="Your secret code">
                    </div>
                    <button type="submit" class="btn btn-primary">Unlock</button>
                    <p id="login-error" class="error-msg"></p>
                </form>
            </div>
        </section>

        <!-- 主畫面 (Dashboard) -->
        <section id="main-section" class="section hidden">
            <header class="header">
                <div class="brand">
                    <span class="app-logo small">💰</span>
                    <span id="welcome-msg">歡迎回來！</span>
                </div>
                <button id="logout-btn" class="btn btn-sm btn-secondary">登出</button>
            </header>

            <!-- 帳戶統計 -->
            <div class="bells-card">
                <div class="budget-main-display" id="budget-section">
                    <span class="label-lg">本月還能花</span>
                    <div class="amount-hero" id="budget-remaining">$0</div>

                    <div class="progress-bar-bg">
                        <div id="budget-progress-bar" class="progress-bar-fill" style="width: 0%"></div>
                    </div>
                    <div class="budget-meta">
                        <span>總預算: <span id="total-budget">$0</span></span>
                        <span id="budget-percent">0%</span>
                    </div>
                </div>

                <div class="bell-stats">
                    <div class="stat-item income">
                        <span class="label">本月收入</span>
                        <span id="total-income" class="amount">0</span>
                    </div>
                    <div class="stat-item expense">
                        <span class="label">本月支出</span>
                        <span id="total-expense" class="amount">0</span>
                    </div>
                </div>
            </div>

            <!-- 功能按鈕區 -->
            <div class="action-grid">
                <button id="btn-add-transaction" class="action-card income">
                    <span class="icon">✏️</span>
                    <span>記一筆</span>
                </button>
                <button id="btn-manage-category" class="action-card expense">
                    <span class="icon">🗂️</span>
                    <span>管理分類</span>
                </button>
            </div>

            <!-- 交易紀錄 -->
            <div class="list-container">
                <div class="list-header">
                    <button id="prev-month-btn" class="month-nav-btn">‹</button>
                    <h3 id="transaction-list-title" class="month-title-clickable">11月收支</h3>
                    <button id="next-month-btn" class="month-nav-btn">›</button>
                </div>
                
                <!-- 圖表區域 -->
                <div id="chart-container" class="chart-container">
                    <canvas id="expense-chart"></canvas>
                </div>
                
                <div id="transaction-list" class="transaction-list">
                    <!-- 動態載入 -->
                </div>
            </div>
        </section>

    </div>

    <!-- 隱藏的 Template 用於 SweetAlert -->
    <template id="tpl-transaction-form">
        <form id="swal-txn-form" class="swal-form">
            <div class="form-group">
                <label>日期</label>
                <input type="date" id="swal-date" class="swal2-input" required>
            </div>
            <div class="form-group">
                <label>收支</label>
                <select id="swal-type" class="swal2-select">
                    <option value="expense">支出</option>
                    <option value="income">收入</option>
                </select>
            </div>
            <div class="form-group">
                <label>類別</label>
                <select id="swal-category" class="swal2-select">
                    <!-- JS 填入 -->
                </select>
            </div>
            <div class="form-group">
                <label>金額</label>
                <input type="number" id="swal-amount" class="swal2-input" placeholder="多少錢？" min="1" required inputmode="numeric">
            </div>
            <div class="form-group">
                <label>備註</label>
                <input type="text" id="swal-note" class="swal2-input" placeholder="例如：買卡片、聚餐">
            </div>
        </form>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
